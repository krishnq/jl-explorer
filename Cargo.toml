[package]
name = "jl-explorer"
version = "0.0.1"
edition = "2021"
description = "Explore, edit and reflash the firmware of JieLi BR25 (AC696N) based speakers"
license = "MIT"
repository = "https://github.com/krishnq/jl-explorer"

[dependencies]
anyhow = "1"
eframe = "0.31"
rfd = "0.15"
open = "5"
serde_json = { version = "1", features = ["preserve_order"] }
miniz_oxide = "0.8"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
